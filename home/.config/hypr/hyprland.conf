source = ~/dotfiles/home/.config/hypr/Monitor_Profiles/default.conf

#para que steam habra los juegos en fullscreen

windowrule = fullscreen on,match:class ^(steam_app_.*)$


exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprpaper
exec-once = cable


$terminal = kitty
$fileManager = thunar
$menu = rofi -no-config -theme ~/.config/rofi/amber-terminal.rasi -show drun


$mainMod = SUPER

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

misc {
    focus_on_activate = true
}

cursor {
    no_warps = true
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(ffb000ff)
    col.inactive_border = rgba(3a2a00ff)
    resize_on_border = true
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

decoration {
    rounding = 2

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = yes
    bezier = retro, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, retro
    animation = fade, 1, 4, retro
    animation = workspaces, 1, 5, retro
}

xwayland {
    force_zero_scaling = true
}

windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
#windowrulev2=suppressevent maximize, class:^(firefox)$
# Apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu

# Window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows (tiled swap)
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

bind = $mainMod, SPACE, togglefloating, # Floating toggle
bind = $mainMod, F, fullscreen, # Fullscreen
#bind = $mainMod, V,
# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# =========================
# MOUSE
# =========================
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#Move window to otherr monitor
bind = SUPER CTRL SHIFT, left, movewindow, mon:l
bind = SUPER CTRL SHIFT, right, movewindow, mon:r
bind = SUPER CTRL SHIFT, up, movewindow, mon:u
bind = SUPER CTRL SHIFT, down, movewindow, mon:d

#Move tiled windows
bind = SUPER, D, exec, hyprctl keyword general:layout dwindle
bind = SUPER, M, exec, hyprctl keyword general:layout master
bind = SUPER, H, layoutmsg, mfact -0.05
bind = SUPER, L, layoutmsg, mfact +0.05



